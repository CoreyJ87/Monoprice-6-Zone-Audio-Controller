snapshot:
  name: Snapshot
  description: Takes a snapshot of the media player zone.
  target:
    entity:
      integration: monoprice
      domain: media_player

restore:
  name: Restore
  description: Restores a snapshot of the media player zone.
  target:
    entity:
      integration: monoprice
      domain: media_player

set_balance:
  name: Set balance
  description: Sets the balance level of the targeted zones.
  target:
    entity:
      integration: monoprice
      domain: media_player
  fields:
    level:
      name: Level
      description: Integer from 0 to 20 inclusive, where 0 is -10 (left), 10 is center and 20 is +10 (right).
      required: true
      example: 10
      default: 10
      selector:
        number:
          min: 0
          max: 20

set_bass:
  name: Set bass
  description: Sets the bass level of the targeted zones.
  target:
    entity:
      integration: monoprice
      domain: media_player
  fields:
    level:
      name: Level
      description: Integer from 0 to 14 inclusive.
      required: true
      example: 10
      default: 7
      selector:
        number:
          min: 0
          max: 14

set_treble:
  name: Set treble
  description: Sets the treble level of the targeted zones.
  target:
    entity:
      integration: monoprice
      domain: media_player
  fields:
    level:
      name: Level
      description: Integer from 0 to 14 inclusive.
      required: true
      example: 10
      default: 7
      selector:
        number:
          min: 0
          max: 14

set_zone_source:
  name: Set zone source
  description: Sets the input source of the targeted zones by its numeric id.
  target:
    entity:
      integration: monoprice
      domain: media_player
  fields:
    source:
      name: Source
      description: Integer from 1 to 6 inclusive.
      required: true
      example: 6
      default: 1
      selector:
        number:
          min: 1
          max: 6

set_all_zones_source:
  name: Set all zones source
  description: Sets the input source of every zone on every configured amplifier.
  fields:
    source:
      name: Source
      description: Integer from 1 to 6 inclusive.
      required: true
      example: 6
      default: 1
      selector:
        number:
          min: 1
          max: 6
